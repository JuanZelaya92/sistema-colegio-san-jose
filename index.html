<!DOCTYPE html>
<html lang="es">

    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>Sistema Colegio San Jose</header>

<div class="layout">
    <aside>
        
        <button onclick="cargarModulo('alumnos')">Alumnos</button>

        <button onclick="cargarModulo('docentes')">Docentes</button>
        <button onclick="cargarModulo('materias')">Materias</button>

    <main id="resultado">

<script src="app.js"></script>
